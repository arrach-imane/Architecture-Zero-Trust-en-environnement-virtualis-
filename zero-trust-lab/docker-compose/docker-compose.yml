# Pile IAM déployée sur Server-IAM (10.10.2.10) — répertoire ~/keycloak/
#
# Reconstitué à partir du lab réel. Les secrets ne sont PAS dans ce fichier :
# ils vivent dans authelia/configuration.yml (non publié, voir .env.example).
#
# Choix volontaires :
#   - aucun port publié pour Keycloak : seul Traefik (80/443) est exposé ;
#   - Traefik n'a PAS accès au socket Docker (provider « file » uniquement) ;
#   - Keycloak en mode start-dev (voir docs/limits.md).

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    command: start-dev
    environment:
      KC_HOSTNAME: https://keycloak.${LAB_DOMAIN:-zerotrust.lab}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # Le compte admin permanent est créé via l'interface ; les variables
      # KEYCLOAK_ADMIN* du bootstrap ont été retirées après usage.
    volumes:
      - keycloak_data:/opt/keycloak/data   # base H2 persistante
    restart: unless-stopped

  traefik:
    image: traefik:v3.3
    container_name: traefik
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --accesslog=true
      - --api.dashboard=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/certs:ro
      - ./traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
    restart: unless-stopped

  authelia:
    image: authelia/authelia:4.38
    container_name: authelia
    volumes:
      - ./authelia:/config
    restart: unless-stopped

  whoami:
    image: traefik/whoami
    container_name: whoami
    restart: unless-stopped

volumes:
  keycloak_data:
