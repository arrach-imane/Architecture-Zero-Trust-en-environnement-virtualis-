# Authelia 4.38 — configuration du lab zerotrust.lab
# Les secrets (jwt_secret, session.secret, storage.encryption_key) sont des
# PLACEHOLDERS : générer les vraies valeurs avec `openssl rand -hex 32`.
#
# ⚠️ storage.encryption_key : ne pas la modifier à la main après le premier
#    démarrage (la base sqlite deviendrait illisible). Pour la changer :
#    `authelia storage encryption change-key`.

server:
  address: tcp://0.0.0.0:9091

identity_validation:
  reset_password:
    jwt_secret: CHANGE_ME_openssl_rand_hex_32

authentication_backend:
  file:
    path: /config/users_database.yml   # non publié (hashs argon2)

access_control:
  default_policy: deny
  rules:
    - domain: whoami.zerotrust.lab
      policy: two_factor
    - domain: nextcloud.zerotrust.lab
      policy: two_factor

session:
  secret: CHANGE_ME_openssl_rand_hex_32
  cookies:
    - domain: zerotrust.lab
      authelia_url: https://auth.zerotrust.lab
      default_redirection_url: https://nextcloud.zerotrust.lab

regulation:
  max_retries: 3
  find_time: 2m
  ban_time: 5m

storage:
  encryption_key: CHANGE_ME_openssl_rand_hex_32
  local:
    path: /config/db.sqlite3

totp:
  issuer: zerotrust.lab

notifier:
  filesystem:
    filename: /config/notification.txt   # lab : pas de SMTP
